[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gpt-from-scratch"
version = "0.1.0"
description = "An educational decoder-only GPT built from PyTorch primitives"
requires-python = ">=3.10"
dependencies = [
    "tokenizers>=0.23.2",
    "torch>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
tracking = ["wandb>=0.18"]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["data", "tokenizer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
